name: upstream-bump

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check upstream releases
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=false
          for pair in \
            "SIDPLAYFP_VERSION:libsidplayfp/sidplayfp" \
            "LIBSIDPLAYFP_VERSION:libsidplayfp/libsidplayfp" \
            "LIBRESIDFP_VERSION:libsidplayfp/libresidfp"; do
            arg=${pair%%:*}
            repo=${pair#*:}
            version=$(gh api "repos/${repo}/releases/latest" -q .tag_name)
            case "${version}" in
              ''|null) echo "cannot resolve latest release of ${repo}" >&2; exit 1;;
            esac
            current=$(sed -n "s/^ARG ${arg}=//p" Dockerfile)
            [ "${version}" = "${current}" ] || changed=true
            sed -i "s|^ARG ${arg}=.*|ARG ${arg}=${version}|" Dockerfile
            echo "${repo}: ${current} -> ${version}"
            [ "${arg}" = SIDPLAYFP_VERSION ] \
              && echo "version=${version}" >> "${GITHUB_OUTPUT}"
          done
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      # PRs opened with GITHUB_TOKEN do not start workflow runs, so the new
      # pins are built and tested here instead of on the pull request.
      - uses: docker/setup-buildx-action@v4
        if: steps.up.outputs.changed == 'true'

      - name: build
        if: steps.up.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sidplayfp:bump
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        if: steps.up.outputs.changed == 'true'
        run: tests/smoke.sh sidplayfp:bump ${{ steps.up.outputs.version }}

      - name: open pull request
        if: steps.up.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-${{ steps.up.outputs.version }}
          commit-message: "sidplayfp ${{ steps.up.outputs.version }}"
          title: "sidplayfp ${{ steps.up.outputs.version }}"
          body: |
            Pin the latest sidplayfp, libsidplayfp and libresidfp releases.
            The three projects version independently; the image version follows
            sidplayfp.

            Built and smoke tested in
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }});
            `ci` does not run on pull requests opened by `GITHUB_TOKEN`.

            Merging releases an image of the same version.
          delete-branch: true
