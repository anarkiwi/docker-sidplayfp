name: release

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'anarkiwi/sidplayfp' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: resolve version
        id: v
        run: |
          version=$(sed -n 's/^ARG SIDPLAYFP_VERSION=//p' Dockerfile)
          [ -n "${version}" ] || { echo "no SIDPLAYFP_VERSION in Dockerfile" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bare=${version#v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sidplayfp:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: tests/smoke.sh sidplayfp:release ${{ steps.v.outputs.version }}

      - name: login to docker hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.bare }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          annotations: |
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists; images refreshed"
            exit 0
          fi
          cat > notes.md <<EOF
          Container image of sidplayfp
          [${VERSION}](https://github.com/libsidplayfp/sidplayfp/releases/tag/${VERSION}).

              docker pull ${IMAGE}:${VERSION}
          EOF
          gh release create "${VERSION}" --target "${GITHUB_SHA}" \
            --title "${VERSION}" --notes-file notes.md
